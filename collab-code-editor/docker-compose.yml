services:
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: piston_api
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    environment:
      # Piston caps each stdio buffer at 1024 bytes by default, and does not
      # truncate when the cap is hit: it drops the offending chunk and SIGABRTs
      # the sandbox, so a program printing more than ~1 KB dies mid-write with
      # "Sandbox keeper received fatal signal 6" (run.status "OL"). A 10x10
      # multiplication table is enough to trigger it. 64 KB per stream is plenty
      # for an editor output panel while still bounding a runaway print loop.
      PISTON_OUTPUT_MAX_SIZE: 65536
      # Piston validates every per-request limit against these ceilings and
      # rejects anything larger with a 400 ("run_timeout cannot exceed the
      # configured limit of 3000" is the default). `app/api/execute/route.ts`
      # sends exactly these numbers per request, so the two must stay in step:
      # lowering a value here without lowering it there breaks *every* run.
      #
      # They double as the defaults for a request that omits the limits, which
      # is what bounds a run started against this Piston by anything other than
      # our route (default run timeout is 3s, memory unlimited).
      #
      # Wall time and CPU time are separate ceilings and both must be raised:
      # `while True: pass` burns CPU as fast as wall clock, so the 3s default
      # run_cpu_time kills it at ~3.1s no matter what run_timeout says.
      PISTON_RUN_TIMEOUT: 5000
      PISTON_RUN_CPU_TIME: 5000
      PISTON_COMPILE_TIMEOUT: 10000
      PISTON_COMPILE_CPU_TIME: 10000
      PISTON_RUN_MEMORY_LIMIT: 268435456 # 256 MB
      PISTON_COMPILE_MEMORY_LIMIT: 536870912 # 512 MB — javac/g++ need the headroom
      # Not overridden, but load-bearing: max_process_count (64) is what bounds a
      # fork bomb, and max_open_files (2048) a descriptor exhaustion loop.
    volumes:
      - piston_data:/piston
    tmpfs:
      - /piston/jobs:exec

volumes:
  piston_data:
