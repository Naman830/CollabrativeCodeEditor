<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Next's `app/icon.svg` file convention: it emits the <link rel="icon">
       itself, so no manual <head> tag is needed. Before this the app shipped no
       icon at all and every page load logged a 404 for /favicon.ico.
       Colours are --accent / --accent-strong from globals.css (dark values, so
       the mark reads on both a light and a dark browser tab strip). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff" />
      <stop offset="1" stop-color="#3b7cf0" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 11l-5 5 5 5" />
    <path d="M19 11l5 5-5 5" />
  </g>
</svg>
